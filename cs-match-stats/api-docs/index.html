<!doctype html>
<!--
  Оболочка Swagger UI для GitHub Pages.
  swagger-ui.css, swagger-ui-bundle.js, favicon-32x32.png и openapi.yaml
  подкладываются рядом при сборке: .github/workflows/pages.yml
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS Match Stats API</title>
  <link rel="icon" type="image/png" href="favicon-32x32.png">
  <link rel="stylesheet" href="swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: 'openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'list',
      // api.example.com — демонстрационный адрес, поэтому «Try it out» отключён.
      supportedSubmitMethods: []
    });
  </script>
</body>
</html>
