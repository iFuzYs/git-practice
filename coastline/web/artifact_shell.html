<title>COASTLINE</title>
<style>
  html, body { height: 100%; margin: 0; background: #080a12; overflow: hidden; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #080a12; }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
           padding-inline: 16px; text-align: center; color: #f5f5f7; font: 500 16px/1.4 system-ui, sans-serif;
           background: radial-gradient(circle at 50% 38%, #2c1532 0%, #0b0d18 62%, #080a12 100%); cursor: pointer; }
  #cover h1 { margin: 0; font: 800 clamp(40px, 9vw, 84px)/1 system-ui, sans-serif; letter-spacing: .06em; color: #ff7426; }
  #cover .sub { margin: 0; letter-spacing: .38em; color: #ec2e84; font-weight: 700; font-size: 14px; }
  #cover .hint { margin: 10px 0 0; color: #b0b8cc; max-width: 36em; }
  #cover button { margin-top: 8px; padding: 14px 34px; border: 0; border-radius: 10px; background: #ff7426; color: #fff;
                  font: 700 18px system-ui, sans-serif; cursor: pointer; }
  #cover button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #cover .keys { color: #8a93aa; font-size: 13px; }
  #bar { width: min(360px, 80vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 5%; background: #ff7426; transition: width .3s; }
  #cover.ready #bar { display: none; }
  [hidden], #cover[hidden] { display: none !important; }
  #err { color: #ff8080; max-width: 40em; }
</style>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="cover">
  <h1>COASTLINE</h1>
  <p class="sub">ФЕСТИВАЛЬ ПОБЕРЕЖЬЯ</p>
  <div id="bar"><i></i></div>
  <p class="hint" id="msg">Загружаем остров…</p>
  <button id="play" type="button" hidden>Играть</button>
  <p class="keys">W A S D — езда · Пробел — ручник · R — перемотка · C — камера · Esc — меню</p>
  <p id="err" hidden></p>
</div>
<script>
  var cover = document.getElementById('cover'), bar = document.querySelector('#bar i'), msg = document.getElementById('msg'), play = document.getElementById('play');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { if (!t) return; var m = t.match(/\((\d+(\.\d+)?)\/(\d+)\)/); if (m) bar.style.width = (parseInt(m[1]) / parseInt(m[3]) * 100) + '%'; },
    onRuntimeInitialized: function () {
      bar.style.width = '100%';
      cover.classList.add('ready');
      msg.textContent = 'Остров готов. Нажмите «Играть», чтобы включить управление и звук.';
      play.hidden = false;
      play.focus();
    }
  };
  Module.onAbort = function (what) {
    var el = document.getElementById('err');
    el.textContent = 'Игра не запустилась: ' + what + '. Если страница запрещает WebAssembly, соберите игру по инструкции в README репозитория.';
    el.hidden = false; cover.hidden = false;
  };
  function start() { cover.hidden = true; Module.canvas.focus(); }
  play.addEventListener('click', start);
  cover.addEventListener('click', function () { if (!play.hidden) start(); });
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab', 'Backspace'].indexOf(e.key) >= 0) e.preventDefault();
  }, { passive: false });
  Module.canvas.addEventListener('click', function () { Module.canvas.focus(); });
  window.onerror = function (e) { var el = document.getElementById('err'); el.textContent = 'Ошибка: ' + e; el.hidden = false; cover.hidden = false; };
</script>
