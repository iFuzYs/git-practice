<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COASTLINE — Фестиваль Побережья</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #080a12; overflow: hidden; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          color: #f5f5f7; font: 600 16px system-ui, sans-serif; background: radial-gradient(circle at 50% 40%, #2a1430, #080a12 70%); }
  #boot h1 { margin: 0 0 6px; font-size: 64px; letter-spacing: 3px; color: #ff7426; }
  #boot p { margin: 0 0 26px; color: #ec2e84; letter-spacing: 6px; }
  #bar { width: 360px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 3%; background: #ff7426; transition: width .2s; }
  #msg { margin-top: 12px; color: #b0b8cc; font-weight: 400; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="boot"><h1>COASTLINE</h1><p>ФЕСТИВАЛЬ ПОБЕРЕЖЬЯ</p><div id="bar"><i></i></div><div id="msg">Загрузка…</div></div>
<script>
  var boot = document.getElementById('boot'), bar = document.querySelector('#bar i'), msg = document.getElementById('msg');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      if (!t) return;
      var m = t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) bar.style.width = (parseInt(m[1]) / parseInt(m[3]) * 100) + '%';
      msg.textContent = t.replace(/\(.*\)/, '').replace('Downloading data...', 'Загрузка…') || 'Загрузка…';
    },
    onRuntimeInitialized: function () { boot.style.display = 'none'; Module.canvas.focus(); }
  };
  // стрелки и пробел не должны прокручивать страницу
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab', 'Backspace'].indexOf(e.key) >= 0) e.preventDefault();
  }, { passive: false });
  window.addEventListener('click', function () { Module.canvas.focus(); });
  window.onerror = function (e) { msg.textContent = 'Ошибка: ' + e; boot.style.display = 'flex'; };
</script>
{{{ SCRIPT }}}
</body>
</html>
