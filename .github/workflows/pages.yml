name: GitHub Pages

# Собирает сайт на GitHub Pages:
#   /        — Swagger UI из cs-match-stats/openapi.yaml
#   /faceit/ — FACEIT-дашборд (faceit-dashboard/), данные обновляются раз в сутки
# На pull request сайт только собирается, дашборд — из демо-данных. Публикация — из main.
# Однократная настройка репозитория: Settings → Pages → Source: GitHub Actions,
# для дашборда — секрет FACEIT_API_KEY и переменная FACEIT_NICKNAME (см. faceit-dashboard/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'cs-match-stats/openapi.yaml'
      - 'cs-match-stats/api-docs/**'
      - 'faceit-dashboard/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'cs-match-stats/openapi.yaml'
      - 'cs-match-stats/api-docs/**'
      - 'faceit-dashboard/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '0 3 * * *'  # 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Swagger UI
        run: |
          npm pack swagger-ui-dist@5 --silent
          tar -xzf swagger-ui-dist-*.tgz
          mkdir -p _site
          cp package/swagger-ui.css package/swagger-ui-bundle.js package/favicon-32x32.png _site/
          cp cs-match-stats/api-docs/index.html cs-match-stats/openapi.yaml _site/

      - name: Тесты дашборда
        run: python -m unittest discover -s faceit-dashboard

      - name: Данные FACEIT
        if: github.event_name != 'pull_request'
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          FACEIT_NICKNAME: ${{ vars.FACEIT_NICKNAME }}
        run: |
          if [ -z "$FACEIT_API_KEY" ] || [ -z "$FACEIT_NICKNAME" ]; then
            echo "::notice::FACEIT_API_KEY или FACEIT_NICKNAME не заданы: дашборд опубликуется как страница-заглушка"
            exit 0
          fi
          python faceit-dashboard/fetch_stats.py --out faceit-data.json

      - name: FACEIT-дашборд
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python faceit-dashboard/build_dashboard.py --demo --out _site/faceit
          elif [ -f faceit-data.json ]; then
            python faceit-dashboard/build_dashboard.py --data faceit-data.json --out _site/faceit
          else
            python faceit-dashboard/build_dashboard.py --placeholder --out _site/faceit
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
