name: API docs

# Собирает Swagger UI из cs-match-stats/openapi.yaml и публикует на GitHub Pages.
# На pull request только проверяет, что сайт собирается; публикация — после merge в main.
# Однократная настройка репозитория: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'cs-match-stats/openapi.yaml'
      - 'cs-match-stats/api-docs/**'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'cs-match-stats/openapi.yaml'
      - 'cs-match-stats/api-docs/**'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать сайт
        run: |
          npm pack swagger-ui-dist@5 --silent
          tar -xzf swagger-ui-dist-*.tgz
          mkdir -p _site
          cp package/swagger-ui.css package/swagger-ui-bundle.js package/favicon-32x32.png _site/
          cp cs-match-stats/api-docs/index.html cs-match-stats/openapi.yaml _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
